<body class="bg-background text-on-surface font-body-sm text-body-sm min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- TopNavBar (Shared Component) -->
<nav class="bg-surface-container-low dark:bg-surface-container-low border-b border-outline-variant flex justify-between items-center px-4 w-full h-14 shrink-0 top-0 z-50">
<div class="flex items-center gap-4">
<span class="text-body-lg font-bold text-primary dark:text-primary tracking-tighter">DevLeap IDE</span>
</div>
<div class="flex-1 flex justify-start pl-8">
<div class="relative w-64">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">search</span>
<input class="w-full bg-surface-container border border-outline-variant rounded-full py-1.5 pl-9 pr-3 text-on-surface font-body-sm text-body-sm focus:outline-none focus:border-primary transition-colors" placeholder="Search..." type="text"/>
</div>
</div>
<div class="flex items-center gap-3">
<div class="flex items-center text-on-surface-variant">
<button class="p-2 hover:bg-secondary-container hover:text-on-surface transition-colors duration-300 rounded cursor-pointer active:opacity-80 group">
<span class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform">terminal</span>
</button>
<button class="p-2 hover:bg-secondary-container hover:text-on-surface transition-colors duration-300 rounded cursor-pointer active:opacity-80 group">
<span class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform">settings</span>
</button>
<button class="p-2 hover:bg-secondary-container hover:text-on-surface transition-colors duration-300 rounded cursor-pointer active:opacity-80 group">
<span class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform">help</span>
</button>
</div>
<button class="bg-primary-container text-on-primary-container font-body-sm text-body-sm px-4 py-1.5 rounded-md hover:brightness-110 transition-all cursor-pointer active:opacity-80 font-bold border border-transparent">

            </button>

</div>

<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto w-full flex justify-center py-8 px-4">
<div class="max-w-[860px] w-full flex flex-col gap-6">
<!-- Header Row -->
<header class="flex items-center justify-between">
<div class="flex items-center gap-4">
<button class="p-2 -ml-2 text-on-surface-variant hover:text-on-surface hover:bg-surface-variant rounded transition-colors" title="返回">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">新增题目</h1>
</div>
<div class="flex items-center gap-3">
<button class="px-4 py-2 border border-outline-variant text-on-surface hover:bg-surface-variant rounded-md font-body-sm text-body-sm transition-colors cursor-pointer">
                        取消
                    </button>
<button class="px-4 py-2 bg-primary-container text-on-primary-container hover:brightness-110 rounded-md font-body-sm text-body-sm font-bold transition-all cursor-pointer shadow-[0_0_10px_rgba(255,87,18,0.2)]">
                        保存草稿
                    </button>
</div>
</header>
<!-- Main Form Area -->
<div class="bg-surface-container rounded-lg border border-outline-variant flex flex-col overflow-hidden">
<div class="p-6 flex flex-col gap-8">
<!-- Basic Info -->
<section>
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase mb-2">基本信息</label>
<input class="w-full bg-surface-container-highest border border-outline-variant text-on-surface font-body-sm text-body-sm rounded-md px-4 py-2.5 focus:outline-none focus:border-primary transition-colors placeholder:text-on-surface-variant/50" placeholder="题目标题 (例如: 两数之和)" type="text"/>
</section>
<!-- Category & Difficulty -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase mb-2">分类标签</label>
<div class="relative">
<select class="w-full bg-surface-container-highest border border-outline-variant text-on-surface font-body-sm text-body-sm rounded-md px-4 py-2.5 appearance-none focus:outline-none focus:border-primary transition-colors cursor-pointer">
<option disabled="" selected="" value="">选择题目分类...</option>
<option value="array">数组 (Array)</option>
<option value="string">字符串 (String)</option>
<option value="dp">动态规划 (Dynamic Programming)</option>
<option value="tree">树 (Tree)</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase mb-2">难度</label>
<div class="flex gap-2">
<button class="flex-1 py-2 rounded-md border border-outline-variant text-on-surface-variant font-body-sm text-body-sm hover:bg-surface-variant transition-colors">简单</button>
<button class="flex-1 py-2 rounded-md bg-primary-container/20 border border-primary-container text-primary-container font-body-sm text-body-sm font-semibold transition-colors">中等</button>
<button class="flex-1 py-2 rounded-md border border-outline-variant text-on-surface-variant font-body-sm text-body-sm hover:bg-surface-variant transition-colors">困难</button>
</div>
</div>
</section>
<!-- Content Editor (Description) -->
<section>
<div class="flex justify-between items-end mb-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase">题目描述 (Markdown)</label>
<div class="flex gap-1 bg-surface-variant rounded px-1 py-0.5">
<button class="p-1 text-on-surface-variant hover:text-on-surface rounded hover:bg-surface-container-high" title="粗体"><span class="material-symbols-outlined text-[16px]">format_bold</span></button>
<button class="p-1 text-on-surface-variant hover:text-on-surface rounded hover:bg-surface-container-high" title="斜体"><span class="material-symbols-outlined text-[16px]">format_italic</span></button>
<button class="p-1 text-on-surface-variant hover:text-on-surface rounded hover:bg-surface-container-high" title="代码块"><span class="material-symbols-outlined text-[16px]">code</span></button>
<button class="p-1 text-on-surface-variant hover:text-on-surface rounded hover:bg-surface-container-high" title="链接"><span class="material-symbols-outlined text-[16px]">link</span></button>
</div>
</div>
<textarea class="w-full bg-surface-container-highest border border-outline-variant text-on-surface font-code-md text-code-md rounded-md px-4 py-3 focus:outline-none focus:border-primary transition-colors resize-y" placeholder="输入题目描述，支持 Markdown 语法..." rows="6"></textarea>
</section>
<!-- Code Template -->
<section>
<div class="flex justify-between items-end mb-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase">初始代码模板</label>
<div class="relative">
<select class="bg-surface-variant border-none text-on-surface font-body-sm text-body-sm rounded px-3 py-1 text-xs appearance-none focus:outline-none cursor-pointer pr-8">
<option>Python 3</option>
<option>Java</option>
<option>C++</option>
<option>JavaScript</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant text-[14px] pointer-events-none">arrow_drop_down</span>
</div>
</div>
<div class="rounded-md overflow-hidden border border-outline-variant editor-bg flex h-48">
<div class="w-10 bg-surface-container-low text-on-surface-variant/50 font-code-md text-[13px] text-right py-3 pr-2 select-none border-r border-outline-variant/30 flex flex-col">
<span>1</span><span>2</span><span>3</span><span>4</span>
</div>
<textarea class="flex-1 bg-transparent text-on-surface font-code-md text-[13px] leading-[22px] p-3 focus:outline-none resize-none" spellcheck="false">class Solution:
    def twoSum(self, nums: List[int], target: int) -&gt; List[int]:
        pass</textarea>
</div>
</section>
<!-- Test Cases -->
<section>
<div class="flex justify-between items-center mb-4">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase">测试用例</label>
<button class="flex items-center gap-1 text-primary hover:brightness-110 font-body-sm text-body-sm transition-colors">
<span class="material-symbols-outlined text-[16px]">add</span> 添加用例
                            </button>
</div>
<div class="flex flex-col gap-4">
<!-- Case Card -->
<div class="bg-surface-container-low border border-outline-variant rounded-md p-4 relative group">
<div class="absolute right-2 top-2 opacity-0 group-hover:opacity-100 transition-opacity">
<button class="p-1.5 text-on-surface-variant hover:text-error rounded hover:bg-error/10 transition-colors">
<span class="material-symbols-outlined text-[18px]">delete</span>
</button>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div>
<div class="text-[12px] text-on-surface-variant mb-1 font-label-caps">输入 (Input)</div>
<textarea class="w-full bg-surface-container-highest border border-outline-variant text-on-surface font-code-md text-[13px] rounded px-3 py-2 focus:outline-none focus:border-primary transition-colors resize-none" placeholder="nums = [2,7,11,15]\ntarget = 9" rows="2"></textarea>
</div>
<div>
<div class="text-[12px] text-on-surface-variant mb-1 font-label-caps">预期输出 (Expected)</div>
<textarea class="w-full bg-surface-container-highest border border-outline-variant text-on-surface font-code-md text-[13px] rounded px-3 py-2 focus:outline-none focus:border-primary transition-colors resize-none" placeholder="[0,1]" rows="2"></textarea>
</div>
</div>
<div class="mt-3 flex items-center gap-2">
<input class="rounded border-outline-variant bg-surface-container-highest text-primary focus:ring-primary focus:ring-offset-surface-container" id="public-case-1" type="checkbox"/>
<label class="text-[13px] text-on-surface-variant cursor-pointer" for="public-case-1">作为公开示例 (展示在题目描述中)</label>
</div>
</div>
</div>
</section>
<!-- Tags -->
<section>
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase mb-2">附加标签</label>
<div class="flex flex-wrap items-center gap-2 bg-surface-container-highest border border-outline-variant rounded-md px-3 py-2 focus-within:border-primary transition-colors min-h-[44px]">
<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded bg-surface-variant text-on-surface font-body-sm text-[12px]">
                                哈希表
                                <span class="material-symbols-outlined text-[14px] cursor-pointer hover:text-primary">close</span>
</span>
<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded bg-surface-variant text-on-surface font-body-sm text-[12px]">
                                高频面试题
                                <span class="material-symbols-outlined text-[14px] cursor-pointer hover:text-primary">close</span>
</span>
<input class="flex-1 bg-transparent border-none text-on-surface font-body-sm text-body-sm p-0 focus:ring-0 min-w-[150px]" placeholder="输入标签后按回车..." type="text"/>
</div>
</section>
</div>
<!-- Footer within card -->
<div class="bg-surface-container-low border-t border-outline-variant p-4 flex justify-end">
<button class="px-6 py-2 bg-primary-container text-on-primary-container hover:brightness-110 rounded-md font-body-sm text-body-sm font-bold transition-all cursor-pointer shadow-[0_0_10px_rgba(255,87,18,0.2)]">
                        正式发布题目
                    </button>
</div>
</div>
<div class="h-12"></div> <!-- Bottom padding -->
</div>
</main>
